<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <script>
    function doShowPrev(fileCtrl, prev) {
      const file = fileCtrl.files[0];//fetching selected file

      if (file) {
        prev.src = URL.createObjectURL(file);//showing file at src section
      }
    }
  </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    
     <script>
      function setEmail(){
          document.getElementById("inputEmail").value=localStorage.getItem("activeuser")
      }
    </script>
</head>

<body onload="setEmail()" style="background-color: rgb(195, 218, 230);">
 <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <div class="collapse navbar-collapse " id="navbarNavAl Markup">
                    <div class="navbar-nav ms-auto" style="font-size: 20px; ">
                        <button class="btn btn-outline-danger" onclick="doLogout()" id="btnLogOut">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 shadow p-4 border rounded p-4 " style="background-color: white;">
        <div class="row ">
            <div class="col-md-12 bg-primary text-black text-center text-white">
                NGO Registration
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 border">
                <form enctype="multipart/form-data" method="post">
                    <center>
                        <div class="text-center col-md-6 mt-5">
                            <input type="file" name="regproof" onchange="doShowPrev(this,prevNGO)">
                            <br>
                            <img src="" id="prevNGO" class="border rounded shadow mt-2" width="100" height="100">
                            <br>
                            Registration Proof:
                        </div>
                    </center>
            </div>
            <div class="col-md-8">
                <div class="row mt-3">
                    <div class="col-md-10">
                        <label for="inputemail" class="form-label">Email</label>
                        <input type="email" class="form-control" name="inputEmail" id="inputEmail" readonly>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-3">
                        <label for="inputngoname" class="form-label">NGO Name</label>
                        <input type="text" class="form-control" name="inputNgoName" id="inputNgoName">
                    </div>
                    <div class="col-md-5">
                        <label for="inputregoff" class="form-label">Registered Office:</label>
                        <input type="text" class="form-control" name="inputRegOff" id="inputRegOff">
                    </div>
                    <div class="col-md-3">
                        <label for="inputcity" class="form-label">CITY</label>
                        <input type="text" class="form-control" name="inputCity" id="inputCity">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-4">
                        <label for="inputwebsite" class="form-label">Website:</label>
                        <input type="text" class="form-control" name="inputWebsite" id="inputWebsite">
                    </div>
                    <div class="col-md-4">
                        <label for="inputcontact" class="form-label">Contact:</label>
                        <input type="text" class="form-control" name="inputContact" id="inputContact">
                    </div>
                    <div class="col-md-3">
                        <label for="inputsince" class="form-label">Since:</label>
                        <input type="text" class="form-control" name="inputSince" id="inputSince">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-4">
                        <label for="inputchair" class="form-label">Chair Person:</label>
                        <input type="text" class="form-control" name="inputChair" id="inputChair">
                    </div>
                    <div class="col-md-4">
                        <label for="inputwork" class="form-label">NGO profile/work:</label>
                        <input type="text" class="form-control" name="inputWork" id="inputWork">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label for="inputregno" class="form-label">Registration Number:</label>
                        <input type="text" class="form-control" name="inputRegNo" id="inputRegNo">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-8">
                        <center>
                            <button type="submit" formaction="/ngo-data" class="btn btn-outline-primary"
                                id="btnReg">Register Now</button>
                        </center>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
