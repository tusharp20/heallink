<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script>

        let myModule = angular.module("moduleKuch", []);
         let myController = myModule.controller("controllerKuch",function($scope,$http){

            $scope.doShowAll = function () {
                let url = "fetch-donor";
                $http.get(url).then(function (resp) {
                    // alert(JSON.stringify(resp.data))
                    $scope.jsonArray = resp.data;
                }, function (err) {
                    alert(err);
                });
            }


         })


    </script>
  </head>
  <body ng-app="moduleKuch" style="background-color: rgb(195, 218, 230);" ng-controller="controllerKuch">
    <center>
        <input type="button" style="margin-top: 8px;" class="btn btn-dark" ng-click="doShowAll();" value="Fetch all records">
            <table width="500" class="table table-dark table-striped-columns w-75 mt-5" border="1">
            <thead>
                <tr>
                    <th scope="col">Sr no.</th>
                    <th scope="col">Email Id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Mobile No.</th>
                    <th scope="col">Address</th>
                    <th scope="col">City</th>
                    <th scope="col">Aadhar Picture</th>
                    <th scope="col">Profile Picture</th>

                </tr>
            </thead>

            <tbody>
                <tr ng-repeat="obj in jsonArray">
                    <td>{{$index+1}}</td>
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.name}}</td>
                    <td>{{obj.mobile}}</td>
                    <td>{{obj.address}}</td>
                    <td>{{obj.city}}</td>
                    <td>
                    <center>
                        <img src={{obj.acardpath}} width="50" height="50"  alt="">
                    </center>
                     </td>
                     <td>
                    <center>
                        <img src={{obj.picpath}} width="50" height="50"  alt="">
                    </center>
                     </td>
                </tr>
            </tbody>

    </center>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
