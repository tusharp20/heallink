<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<script>
      function setEmail(){
          document.getElementById("inputEmail").value=localStorage.getItem("activeuser")
          
      }
    </script>
<script>
        function doLogout() {
            localStorage.removeItem("activeuser");
            location.href = "/";
        }

    </script>
<script>
    let myModule = angular.module("moduleKuch", []);
    let myController = myModule.controller("controllerKuch", function ($scope, $http) {
        $scope.doShowCities = function () {
            let url = "/fetch-cities";
            $http.get(url).then(function (resp) {
                // alert(JSON.stringify(resp.data))
                $scope.jsonArrayCities = resp.data;
            }, function (err) {
                alert(err);
            })
        }
        $scope.doShowNgoByCity = function () {
            let url = "/show-ngo?city=" + $scope.selCity;
            $http.get(url).then(function (resp) {
                $scope.jsonArrayNgos = resp.data;
            }, function (err) {
                alert(err);
            })
        }



    })
</script>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowCities()" style="background-color: rgb(195, 218, 230);;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <div class="collapse navbar-collapse " id="navbarNavAl Markup">
                    <div class="navbar-nav ms-auto" style="font-size: 20px; ">
                        <button class="btn btn-outline-danger" onclick="doLogout()" id="btnLogOut">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <br>

    <div class="container mt-4  shadow p-4 border rounded p-4" style="background-color: white">
        <div class="row mt-4 justify-content-center align-items-center">
            <div class="col-md-4">
                <label>Select City:</label>

                <input list="city-list" ng-model="selCity" placeholder="Type or select...">
                <datalist id="city-list">
                    <option ng-repeat="obj in jsonArrayCities" value="{{obj.city}}"></option>
                </datalist>
            </div>

            <div class="col-md-3">
                <input type="button" class="btn btn-outline-primary" value="Filter Data" ng-click="doShowNgoByCity()">
            </div>
        </div>

        <center>
            <table width="500" class="table table-striped-columns w-75 mt-5 shadow-lg" border="1">
                <thead>
                    <tr>
                         <th scope="col">Sr no.</th>
                        <th scope="col">Email Id</th>
                        <th scope="col">NGO Name</th>
                        <th scope="col">Office</th>
                        <th scope="col">City</th>
                         <th scope="col">Website</th>
                        <th scope="col">Contact</th>
                        <th scope="col">Since</th>
                        <th scope="col">Chair Person</th>
                        <th scope="col">Work</th>
                        <th scope="col">Registered No.</th>
                    </tr>
                </thead>

                <tbody>
                    <tr ng-repeat="obj in jsonArrayNgos">
                        <td>{{index+1}}</td>
                        <td>{{obj.emailid}}</td>
                        <td>{{obj.ngo}}</td>
                        <td>{{obj.regoffice}}</td>
                        <td>{{obj.city}}</td>
                        <td>{{obj.website}}</td>
                        <td>{{obj.contactno}}</td>
                        <td>{{obj.since}}</td>
                        <td>{{obj.chairperson}}</td>
                         <td>{{obj.ngoworks}}</td>
                         <td>{{obj.regnumber}}</td>
                    </tr>
                </tbody>
            </table>
        </center>
    </div>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
