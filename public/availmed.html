<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <script>
        function doLogout() {
            localStorage.removeItem("activeuser");
            location.href = "/";
        }

    </script>
  <script>
    function doShowPrev(fileCtrl, prev) {
      const file = fileCtrl.files[0];//fetching selected file

      if (file) {
        prev.src = URL.createObjectURL(file);//showing file at src section
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<script>
  function setEmail() {
    document.getElementById("inputEmail").value = localStorage.getItem("activeuser")
  }
</script>

<body onload="setEmail()" style=" background-color: rgb(195, 218, 230);">
   <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <div class="collapse navbar-collapse " id="navbarNavAl Markup">
                    <div class="navbar-nav ms-auto" style="font-size: 20px; ">
                        <button class="btn btn-outline-danger" onclick="doLogout()" id="btnLogOut">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
  <div class="container mt-4 shadow p-4 border rounded p-4">
    <div class="row">
      <div class="col-md-12 bg-primary text-black text-center">
        Avail Medicine
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 border">
        <form enctype="multipart/form-data" method="post">
          <center>
            <div class="text-center col-md-6 mt-4">
              <input type="file" name="medPic" onchange="doShowPrev(this,prevMedicine)">
              <br>
              <img src="" id="prevMedicine" class="border rounded shadow mt-2" width="100" height="100">
              <br>
              Medicine Image:
            </div>
          </center>

      </div>

      <div class="col-md-8">
        <div class="row mt-3">
          <div class="col-md-10">
            <label for="inputEmail" class="form-label">Email</label>
            <input type="email" class="form-control" name="inputEmail" id="inputEmail" readonly>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="inputmedname" class="form-label">Medicine Name</label>
            <input type="text" class="form-control" name="inputMedName" id="inputMedName">
          </div>
          <div class="col-md-3">
            <label for="inputdate" class="form-label">Expiry Date</label>
            <input type="date" class="form-control" name="inputDate" id="inputDate">
          </div>
          <div class="col-md-3">
            <label for="inputcompany" class="form-label">Company Name</label>
            <input type="text" class="form-control" name="inputCompany" id="inputCompany">
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-md-4">
            <select class="form-select" id="packing" name="packing" aria-label="Default select example">
              <option selected>Select Packing Type</option>
              <option value="SYRUP">SYRUP</option>
              <option value="TABLETS">TABLETS</option>
              <option value="SACHET">SACHET</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="qty" name="qty" aria-label="Default select example">
              <option selected>Select Quantity </option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>
          <div class="col-md-3 ">
            <label for="inputinfo" class="form-label">Other Info:</label>
            <input type="text" class="form-control" name="inputInfo" id="inputInfo">
          </div>
        </div>
        <div class="row mt-3"></div>
        <div class="col-md-8">
          <center>
            <button type="submit" formaction="/med-data" class="btn btn-outline-primary" id="btnAvail">Avail</button>
          </center>
        </div>
      </div>

      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
