<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <script>
        function doShowPrev(fileCtrl, prev) {
            const file = fileCtrl.files[0];//fetching selected file

            if (file) {
                prev.src = URL.createObjectURL(file);//showing file at src section
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
         <script>
      function setEmail(){
          document.getElementById("inputEmail").value=localStorage.getItem("activeuser")
      }
    </script>
    <script>
        $(document).ready(function () {

            $("#donate").click(function () {
                $("#inputAmount").prop("disabled", true);
                $("#inputAmount").val("");
            });
            $("#sale").click(function () {
                $("#inputAmount").prop("disabled", false);
            });

        });
    </script>
</head>

<body onload="setEmail()">
    <div class="container mt-2 shadow p-4 border rounded p-4">
        <div class="row">
            <div class="col-mid-12 bg-primary text-white text-center">
                Avail Equipment
            </div>
        </div>
        <form enctype="multipart/form-data" method="post">
            <div class="row mt-2">
                <div class="col-md-6">
                    <label for="inputEmail" class="form-label">Email Id:</label>
                    <input type="email" class="form-control" name="inputEmail" id="inputEmail" readonly>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="inputequip" class="form-label">Medical Equipment Type:</label>
                    <input type="text" class="form-control" name="inputEquip" id="inputEquip">
                </div>
                <!-- diff -->
                <div class="col-md-3">
                    <label for="condition" class="form-label">Equipment Condition:</label>
                    <select class="form-select" id="condition" name="condition" required>
                        <option value="" selected disabled>Select Condition</option>
                        <option value="NEW">NEW</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-3">
                    <input class="form-check-input" type="radio" name="RadioAmount" id="donate">
                    <label class="form-check-label" for="donate">
                        DONATION
                    </label>
                </div>
                <div class="col-md-3">
                    <input class="form-check-input" type="radio" name="RadioAmount" id="sale">
                    <label class="form-check-label" for="sale">
                        FOR SALE
                    </label>
                    </div>
                <div class="col-md-3">
                    <label for="inputAmount" class="form-label">Enter Amount:</label>
                    <input type="text" class="form-control" name="inputAmount" id="inputAmount" placeholder="₹0" disabled>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    Upload Picture:
                    <br>
                    <input type="file" name="pic1" onchange="doShowPrev(this,prevPic1)">
                    <br>
                    <img src="" id="prevPic1" class="border rounded shadow mt-2" width="100" height="100">
                </div>
                <div class="col-md-6">
                    Upload Picture:
                    <br>
                    <input type="file" name="pic2" onchange="doShowPrev(this,prevPic2)">
                    <br>
                    <img src="" id="prevPic2" class="border rounded shadow mt-2" width="100" height="100">
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label for="floatingTextarea">Other Info:</label>
                    <textarea class="form-control" name="inputInfo" id="inputInfo"></textarea>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-12">
                    <center>
                        <button type="submit" formaction="/equip-data" class="btn btn-outline-primary" id="btnAvail">Avail
                            For Needy's</button>
                    </center>
                </div>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
